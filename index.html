<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#172554">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>JURA INFO 72H</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f7fb;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.wrap{max-width:720px;margin:auto;padding:24px 16px 40px}
header{padding:8px 4px 12px}.tag{display:inline-block;background:#e0e7ff;color:#1e3a8a;padding:7px 11px;border-radius:20px;font-weight:800;font-size:13px}
h1{font-size:30px;margin:10px 0 4px}.muted,.small{color:#667085}.card{background:#fff;border:1px solid #dbe2ea;border-radius:20px;padding:20px;margin:14px 0;box-shadow:0 4px 18px rgba(23,37,84,.06)}
h2{margin:0 0 12px}button{display:block;width:100%;padding:16px;margin:9px 0;border:0;border-radius:15px;background:#172554;color:#fff;font-size:17px;font-weight:800}
button.alt{background:#fff;color:#172554;border:1px solid #cbd5e1}
input[type=text]{width:100%;padding:15px;border:1px solid #cbd5e1;border-radius:13px;font-size:17px;margin:7px 0 12px}
.progress{height:8px;background:#e5e7eb;border-radius:99px;overflow:hidden;margin:14px 0}.fill{height:100%;background:#2563eb;width:0;transition:.2s}
.q{font-size:20px;font-weight:800;margin-top:18px}.scenario{line-height:1.55;margin:14px 0}
.option{display:block;border:1px solid #dbe2ea;border-radius:13px;padding:14px;margin:9px 0;background:#fff;line-height:1.4}
.option input{margin-right:9px;transform:scale(1.2)}.hidden{display:none}.score{font-size:56px;font-weight:900;text-align:center;color:#172554}
.center{text-align:center}.small{font-size:13px;line-height:1.5}table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px;border-bottom:1px solid #e5e7eb;text-align:left}
hr{border:0;border-top:1px solid #e5e7eb;margin:20px 0}
</style>
</head>
<body>
<div class="wrap">
<header><span class="tag">JURA INFO 72H</span><h1>Odporność informacyjna</h1><div class="muted">Test kompetencji informacyjnych młodzieży</div></header>

<div id="home" class="card">
<h2>Wybierz badanie</h2>
<p>10 pytań • około 10–15 minut • maks. 20 punktów</p>
<label class="muted">Identyfikator uczestnika</label>
<input id="pid" type="text" placeholder="np. ZS-P-001" autocomplete="off">
<button onclick="begin('PRE')">PRE — przed projektem</button>
<button class="alt" onclick="begin('POST')">POST — po projekcie</button>
<p class="small">Nie wpisuj imienia ani nazwiska. Użyj kodu uczestnika.</p>
<hr>
<button class="alt" onclick="showAdmin()">Panel prowadzącego</button>
</div>

<div id="quiz" class="hidden">
<div class="card">
<div id="mode" class="tag"></div>
<div class="progress"><div id="fill" class="fill"></div></div>
<div id="q"></div>
</div>
<button onclick="nextQ()" id="nextBtn">Dalej</button>
<button class="alt" onclick="home()">Przerwij</button>
</div>

<div id="result" class="card hidden center">
<h2>Twój wynik</h2><div class="score" id="score"></div><div id="interp"></div>
<button onclick="saveResult()">Zapisz wynik</button>
<button class="alt" onclick="home()">Zakończ</button>
</div>

<div id="admin" class="card hidden">
<h2>Panel prowadzącego</h2>
<p class="small">Wyniki są przechowywane lokalnie na tym urządzeniu.</p>
<div id="adminTable"></div>
<button onclick="exportCSV()">Eksportuj CSV</button>
<button class="alt" onclick="clearResults()">Usuń wszystkie wyniki z tego urządzenia</button>
<button class="alt" onclick="home()">Powrót</button>
</div>
</div>

<script>
const PRE=[
["PILNA INFORMACJA","Na grupie klasowej ktoś publikuje: <b>„PILNE! Jutro wszystkie szkoły w Porębie zostają zamknięte z powodu zagrożenia. Przekażcie wszystkim!”</b><br><br>Nie wiadomo, kto jest autorem. Co robisz jako pierwsze?",["Przesyłam ją dalej, żeby inni wiedzieli.","Sprawdzam, czy informację potwierdza oficjalne źródło.","Pytam kolegów, czy też o tym słyszeli.","Zakładam, że skoro napisano „PILNE”, informacja jest ważna."],1],
["KTÓREMU ŹRÓDŁU UFASZ?","Pojawia się informacja: <b>„Jutro w mieście może zabraknąć wody”.</b><br><br>Którego źródła szukasz przede wszystkim?",["Komentarzy na Facebooku.","Filmu influencera.","Oficjalnego komunikatu właściwego przedsiębiorstwa lub urzędu.","Wiadomości przesłanej przez znajomego."],2],
["STARY FILM","Widzisz film z podpisem: <b>„Właśnie teraz! Wielka akcja służb w centrum miasta!”</b><br><br>Po sprawdzeniu okazuje się, że film został nagrany trzy lata wcześniej. Co jest najważniejszym problemem?",["Film ma dużo wyświetleń.","Film może być prawdziwy, ale przedstawia wydarzenie z innego czasu.","Film został nagrany telefonem.","Film jest za krótki."],1],
["EMOCJE","Post zawiera: <b>„JEŚLI MASZ DZIECI, NATYCHMIAST TO UDOSTĘPNIJ!!! WŁADZE UKRYWAJĄ PRAWDĘ!!!”</b><br><br>Nie ma podanego źródła ani dokumentów. Co powinno zwrócić uwagę?",["Silny język emocjonalny może być elementem manipulacji.","Skoro ostrzega rodziców, informacja musi być prawdziwa.","Dużo wykrzykników oznacza, że sprawa jest pilna.","Należy natychmiast udostępnić."],0],
["PODSZYWANIE SIĘ","Otrzymujesz komunikat z profilu: <b>„POLICJA POLSKA – WAŻNY KOMUNIKAT”</b>.<br><br>Profil ma logo Policji, ale adres strony wygląda nietypowo. Co robisz?",["Uznaję komunikat za prawdziwy, bo jest logo.","Udostępniam go znajomym.","Sprawdzam komunikat w oficjalnym kanale Policji.","Sprawdzam, ile osób go polubiło."],2],
["ZDJĘCIE I AI","Widzisz bardzo realistyczne zdjęcie przedstawiające rzekome wydarzenie kryzysowe. Nie wiadomo, kto je wykonał. Co robisz?",["Skoro wygląda realistycznie, jest prawdziwe.","Sprawdzam źródło, datę, kontekst i szukam potwierdzenia w innych wiarygodnych źródłach.","Pytam AI, czy zdjęcie jest prawdziwe, i przyjmuję jej odpowiedź.","Udostępniam, ale dodaję „nie wiem, czy to prawda”."],1],
["SPRZECZNE KOMUNIKATY","Podczas lokalnego zdarzenia pojawiają się trzy informacje: anonimowy użytkownik, lokalny profil informacyjny i oficjalne służby. Informacje są sprzeczne. Co robisz?",["Wybieram tę, która brzmi najbardziej przekonująco.","Wybieram tę, którą udostępniło najwięcej osób.","Sprawdzam oficjalny komunikat i aktualność informacji.","Wybieram pierwszą informację, którą zobaczyłem."],2],
["„PODEŚLIJ DALEJ”","Znajomy wysyła: <b>„Nie wiem, czy to prawda, ale podobno…”</b> i prosi: <b>„Podeślij dalej wszystkim!”</b> Co robisz?",["Udostępniam, bo znajomy ostrzegł.","Udostępniam i dopisuję „prawdopodobnie”.","Najpierw próbuję zweryfikować informację.","Udostępniam tylko najbliższym znajomym."],2],
["DWIE WERSJE","Dwa popularne profile przedstawiają zupełnie różne informacje o tym samym wydarzeniu. Co robisz?",["Wybieram informację zgodną z moimi poglądami.","Wybieram profil z większą liczbą obserwujących.","Sprawdzam źródła obu informacji i szukam niezależnego potwierdzenia.","Uznaję, że prawdy nie da się ustalić."],2],
["MODEL JURA INFO 72H","Masz informację, która może być ważna dla innych, ale nie masz pewności, czy jest prawdziwa. Wybierz właściwą kolejność:",["PRZEKAŻ → SPRAWDŹ → OCEŃ → ZDECYDUJ → ZATRZYMAJ","ZATRZYMAJ → SPRAWDŹ → OCEŃ → ZDECYDUJ → PRZEKAŻ","SPRAWDŹ → ZATRZYMAJ → ZDECYDUJ → OCEŃ → PRZEKAŻ","ZDECYDUJ → OCEŃ → SPRAWDŹ → ZATRZYMAJ → PRZEKAŻ"],1]
];

const POST=[
["KOMUNIKAT O EWAKUACJI","Na grupie pojawia się: <b>„UWAGA! Ewakuacja szkoły jutro o 8:00. Nauczyciele nic nie mówią, ale ktoś dostał wiadomość od znajomego z urzędu.”</b><br><br>Co robisz najpierw?",["Udostępniam informację rodzicom.","Sprawdzam oficjalny komunikat szkoły/służb lub właściwej instytucji.","Pytam kolegów, czy też coś wiedzą.","Przyjmuję informację jako prawdziwą."],1],
["AWARIA SYSTEMU","W internecie pojawia się informacja: <b>„Awaria systemu spowoduje dziś problemy z funkcjonowaniem miasta”.</b><br><br>Które źródło będzie dla Ciebie najważniejsze?",["TikTok.","Komentarze mieszkańców.","Oficjalny komunikat odpowiedniej instytucji.","Popularny lokalny profil."],2],
["ZDJĘCIE Z „DZISIAJ”","Widzisz zdjęcie przedstawiające zalaną ulicę z podpisem: <b>„Tak wygląda Poręba dzisiaj”.</b><br><br>Nie wiadomo, kiedy i gdzie zdjęcie wykonano. Co robisz?",["Zakładam, że jest aktualne.","Sprawdzam datę, miejsce i źródło zdjęcia.","Patrzę na liczbę polubień.","Udostępniam z pytajnikiem."],1],
["„MEDIA TO UKRYWAJĄ”","Post mówi: <b>„MEDIA TEGO NIE POKAŻĄ! TYLKO MY MÓWIMY PRAWDĘ! UDOSTĘPNIJ, ZANIM USUNĄ!”</b><br><br>Nie podano źródeł. Co robisz?",["Traktuję to jako dowód, że informacja jest prawdziwa.","Zwracam uwagę na emocjonalny język i brak weryfikowalnego źródła.","Udostępniam znajomym.","Uznaję, że skoro ktoś tak mocno ostrzega, musi wiedzieć więcej."],1],
["FAŁSZYWY PROFIL","Pojawia się profil: <b>„URZĄD MIASTA – PILNE INFORMACJE”</b>. Ma herb miasta i wiele podobnych postów. Co sprawdzasz?",["Liczbę obserwujących.","Liczbę komentarzy.","Czy profil i komunikat są powiązane z oficjalnym kanałem urzędu.","Czy znajomi go obserwują."],2],
["FILM WYGENEROWANY LUB ZMANIPULOWANY","Oglądasz film, na którym znana osoba wypowiada bardzo kontrowersyjne słowa. Film wygląda realistycznie. Co robisz?",["Uznaję go za prawdziwy.","Sprawdzam źródło filmu i szukam niezależnego potwierdzenia.","Udostępniam go, zanim zostanie usunięty.","Zakładam, że każdy film może być prawdziwy."],1],
["PRESJA CZASU","Podczas kryzysu masz pięć sprzecznych komunikatów. Znajomi naciskają: <b>„Szybko! Musimy wiedzieć, co się dzieje!”</b> Co robisz?",["Wybieram najbardziej dramatyczną wersję.","Sprawdzam aktualne informacje ze źródeł oficjalnych i wiarygodnych.","Wybieram informację z największą liczbą udostępnień.","Przekazuję wszystkie informacje dalej."],1],
["INFORMACJA OD ZNAJOMEGO","Znajomy pisze: <b>„Mój kolega pracuje w urzędzie i mówi, że…”</b>, ale nie podaje szczegółów. Co robisz?",["Traktuję ją jak informację oficjalną.","Przekazuję dalej.","Traktuję ją jako niepotwierdzoną i próbuję znaleźć niezależne potwierdzenie.","Uznaję ją za prawdziwą, bo znajomy zna pracownika urzędu."],2],
["POPULARNOŚĆ ≠ WIARYGODNOŚĆ","Film dotyczący kryzysu ma milion wyświetleń. Oficjalny komunikat instytucji ma 500 wyświetleń. Który fakt jest najważniejszy przy ocenie wiarygodności?",["Liczba wyświetleń.","Liczba komentarzy.","Źródło, możliwość jego sprawdzenia i zgodność z innymi wiarygodnymi informacjami.","Popularność autora."],2],
["MODEL JURA INFO 72H","Uzupełnij model działania. Wybierz właściwą kolejność:",["OCEŃ → ZATRZYMAJ → SPRAWDŹ → PRZEKAŻ → ZDECYDUJ","ZATRZYMAJ → SPRAWDŹ → OCEŃ → ZDECYDUJ → PRZEKAŻ","SPRAWDŹ → OCEŃ → ZATRZYMAJ → ZDECYDUJ → PRZEKAŻ","ZDECYDUJ → SPRAWDŹ → OCEŃ → PRZEKAŻ → ZATRZYMAJ"],1]
];

let qs=[],mode="",i=0,scoreValue=0,pid="",lastSaved=false;
const $=x=>document.getElementById(x);
function hideAll(){["home","quiz","result","admin"].forEach(x=>$(x).classList.add("hidden"))}
function home(){hideAll();$("home").classList.remove("hidden")}
function begin(m){pid=$("pid").value.trim()||"bez_ID";mode=m;qs=m==="PRE"?PRE:POST;i=0;scoreValue=0;lastSaved=false;hideAll();$("quiz").classList.remove("hidden");$("mode").textContent=m==="PRE"?"PRE • WERSJA A":"POST • WERSJA B";render()}
function render(){let x=qs[i];$("fill").style.width=(i/10*100)+"%";$("q").innerHTML='<div class="q">'+(i+1)+'. '+x[0]+'</div><div class="scenario">'+x[1]+'</div>'+x[2].map((o,n)=>'<label class="option"><input type="radio" name="answer" value="'+n+'"> '+o+'</label>').join("");$("nextBtn").textContent=i===9?"Zakończ test":"Dalej"}
function nextQ(){let a=document.querySelector('input[name="answer"]:checked');if(!a){alert("Wybierz odpowiedź.");return}if(+a.value===qs[i][3])scoreValue+=2;i++;if(i<10)render();else finish()}
function finish(){hideAll();$("result").classList.remove("hidden");$("score").textContent=scoreValue+"/20";let t=scoreValue<=7?"Kompetencje wymagające intensywnego wsparcia":scoreValue<=11?"Poziom podstawowy":scoreValue<=15?"Poziom umiarkowanie rozwinięty":scoreValue<=18?"Poziom dobry":"Poziom bardzo dobry";$("interp").innerHTML="<h3>"+t+"</h3><p class='small'>Interpretacja robocza na potrzeby ewaluacji projektu; nie jest to diagnoza psychologiczna.</p>"}
function saveResult(){if(lastSaved)return;let r=JSON.parse(localStorage.getItem("jura72h")||"[]");r.push({id:pid,tryb:mode,wynik:scoreValue,data:new Date().toLocaleString("pl-PL")});localStorage.setItem("jura72h",JSON.stringify(r));lastSaved=true;alert("Wynik zapisany na tym urządzeniu.")}
function showAdmin(){hideAll();$("admin").classList.remove("hidden");renderAdmin()}
function renderAdmin(){let r=JSON.parse(localStorage.getItem("jura72h")||"[]");if(!r.length){$("adminTable").innerHTML="<p>Brak zapisanych wyników.</p>";return}let h="<table><tr><th>ID</th><th>Tryb</th><th>Wynik</th><th>Data</th></tr>";r.forEach(x=>h+="<tr><td>"+x.id+"</td><td>"+x.tryb+"</td><td>"+x.wynik+"/20</td><td>"+x.data+"</td></tr>");$("adminTable").innerHTML=h+"</table>"}
function exportCSV(){let r=JSON.parse(localStorage.getItem("jura72h")||"[]");if(!r.length){alert("Brak wyników.");return}let csv="ID;Tryb;Wynik;Data\n"+r.map(x=>x.id+";"+x.tryb+";"+x.wynik+";"+x.data).join("\n");let blob=new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8"});let a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="JURA_INFO_72H_wyniki.csv";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function clearResults(){if(confirm("Usunąć wszystkie wyniki z tego urządzenia?")){localStorage.removeItem("jura72h");renderAdmin()}}
</script>
</body>
</html>
